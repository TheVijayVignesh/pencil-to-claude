<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sketch">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="manifest" id="manifest">
<title>Pencil to Claude</title>
<style>
  :root {
    --paper: #f7f4ee; --ink: #1f1e1c; --muted: #7a756c; --bar: rgba(255,255,255,.88);
    --line: rgba(0,0,0,.08); --accent: #c96442; --accent-ink: #fff; --ok: #3c8a5a; --warn: #b8862b; --bad: #b3412e;
    --grid: rgba(0,0,0,.10);
  }
  :root[data-theme="dark"] {
    --paper: #1c1b19; --ink: #ece8e0; --muted: #9c968b; --bar: rgba(44,42,38,.9);
    --line: rgba(255,255,255,.1); --grid: rgba(255,255,255,.09); --ok: #5cb87f; --warn: #d9a441; --bad: #d0583f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink);
    font: 15px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; touch-action: none;
    background-image: radial-gradient(circle, var(--grid) 1.1px, transparent 1.4px); background-size: 28px 28px; }
  #top { position: fixed; z-index: 2; left: calc(env(safe-area-inset-left) + 16px); bottom: calc(env(safe-area-inset-bottom) + 64px);
    padding: 7px 14px; border-radius: 999px; font-size: 13px; color: var(--muted); background: var(--bar);
    border: 1px solid var(--line); display: none; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #bar { position: fixed; z-index: 2; top: calc(env(safe-area-inset-top) + 12px); left: 50%; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; padding: 6px; width: max-content; max-width: calc(100vw - 24px);
    background: var(--bar); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 6px 24px rgba(0,0,0,.08); scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 2px; flex: none; }
  button, label, select { touch-action: manipulation; }
  button { font: inherit; color: inherit; border: 0; background: transparent; cursor: pointer; }
  .tool { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .tool svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tool[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .tool:disabled { opacity: .3; }
  .sw { width: 30px; height: 30px; border-radius: 50%; flex: none; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .sw[aria-pressed="true"] { border-color: var(--paper); box-shadow: 0 0 0 2px var(--ink); }
  #custom { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  #custom input { position: absolute; inset: -10px; opacity: 0; width: 60px; height: 60px; }
  .size { display: flex; align-items: center; gap: 8px; padding: 0 6px; flex: none; }
  .size input { width: 120px; accent-color: var(--ink); }
  #dot { width: 28px; height: 28px; display: grid; place-items: center; }
  #dot i { display: block; border-radius: 50%; background: var(--ink); }

  #dock { position: fixed; z-index: 2; right: calc(env(safe-area-inset-right) + 16px); bottom: calc(env(safe-area-inset-bottom) + 16px);
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #where { display: flex; padding: 4px; gap: 2px; background: var(--bar); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  #where button { padding: 9px 12px; border-radius: 10px; font-size: 14px; color: var(--muted); }
  #where button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #fallback { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px;
    background: var(--bar); padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); }
  #fallback select { font: inherit; color: var(--ink); background: transparent; border: 0; }
  #send { display: flex; align-items: center; gap: 10px; padding: 16px 24px; border-radius: 18px; font-size: 17px; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px rgba(201,100,66,.35); }
  #send:disabled { opacity: .6; }
  .row { display: flex; gap: 8px; }
  #clear2 { display: flex; align-items: center; gap: 8px; padding: 16px 20px; border-radius: 18px; font-size: 17px; font-weight: 600;
    background: var(--bar); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  #clear2 svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #send svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #status { position: fixed; z-index: 2; left: calc(env(safe-area-inset-left) + 16px); bottom: calc(env(safe-area-inset-bottom) + 16px);
    display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
    background: var(--bar); padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); }
  #status b { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #status.ok b { background: var(--ok); } #status.warn b { background: var(--warn); } #status.bad b { background: var(--bad); }

  #toast { position: fixed; z-index: 3; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translate(-50%, 20px);
    opacity: 0; transition: .25s; pointer-events: none; padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--paper);
    font-size: 15px; max-width: min(520px, calc(100vw - 32px)); text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: var(--bad); }

  @media (max-width: 700px) { .size input { width: 80px; } #dock { left: 16px; align-items: stretch; } #status { display: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="ink"></canvas>
  <canvas id="live"></canvas>
  <canvas id="tip"></canvas>
</div>

<div id="bar" role="toolbar" aria-label="Drawing tools">
  <button class="tool" data-tool="pen" aria-pressed="true" title="Pen" aria-label="Pen">
    <svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L16.5 4.1a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14.5 6l3.5 3.5"/></svg></button>
  <button class="tool" data-tool="marker" aria-pressed="false" title="Highlighter" aria-label="Highlighter">
    <svg viewBox="0 0 24 24"><path d="M9 15l-3 3v2h4l2-2"/><path d="M9 15l8.5-8.5a2.1 2.1 0 0 1 3 3L12 18z"/><path d="M3 21h18" opacity=".5"/></svg></button>
  <button class="tool" data-tool="eraser" aria-pressed="false" title="Eraser" aria-label="Eraser">
    <svg viewBox="0 0 24 24"><path d="M7 20h13"/><path d="M4.6 14.6l9.9-9.9a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L11 18H8z"/><path d="M9.5 9.7l4.8 4.8"/></svg></button>
  <div class="sep"></div>
  <div id="swatches" style="display:flex;gap:6px;align-items:center;flex:none"></div>
  <label class="sw" id="custom" title="Custom color" aria-label="Custom color"><input type="color" id="picker" value="#1f1e1c"></label>
  <div class="sep"></div>
  <div class="size">
    <div id="dot"><i></i></div>
    <input id="width" type="range" min="1" max="40" step="0.5" value="3" aria-label="Thickness">
  </div>
  <div class="sep"></div>
  <button class="tool" id="undo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="tool" id="redo" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="tool" id="clear" title="Clear page" aria-label="Clear page"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>
  <button class="tool" id="penonly" aria-pressed="false" title="Pencil only: Pencil draws, fingers scroll" aria-label="Pencil only">
    <svg viewBox="0 0 24 24"><path d="M12 3v4"/><path d="M8 11l4-4 4 4v9H8z"/><path d="M8 20h8"/><circle cx="12" cy="14" r="1.2"/></svg></button>
  <button class="tool" id="theme" title="Dark / light page" aria-label="Toggle dark mode">
    <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
</div>
<button id="top">↑ Back to top</button>

<div id="status"><b></b><span>Checking Mac…</span></div>

<div id="dock">
  <div id="where" role="radiogroup" aria-label="Send to">
    <button data-where="active" aria-pressed="true">Open session</button>
    <button data-where="chat" aria-pressed="false">New chat</button>
    <button data-where="code" aria-pressed="false">New code</button>
  </div>
  <label id="fallback">If nothing is open, start a
    <select id="fb"><option value="chat">chat</option><option value="code">code session</option></select>
  </label>
  <div class="row">
  <button id="clear2" aria-label="Clear page"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>Clear</button>
  <button id="send"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5L20 4"/></svg>Send to Claude</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // ---------- settings & pairing ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('sk.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('sk.' + k, JSON.stringify(v)); } catch {} },
  };
  const qsToken = new URLSearchParams(location.search).get('t');
  if (qsToken) store.set('token', qsToken);
  const TOKEN = qsToken || store.get('token', '');
  document.getElementById('manifest').href = '/manifest.webmanifest?t=' + encodeURIComponent(TOKEN);

  // 'ink' is black on the light page and off-white on the dark page.
  const COLORS = ['ink', '#e5484d', '#f08c00', '#f5c400', '#2f9e44', '#1c7ed6', '#7048e8', '#868e96'];
  const THEMES = { light: { paper: '#f7f4ee', ink: '#1f1e1c' }, dark: { paper: '#1c1b19', ink: '#ece8e0' } };
  let theme = store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const resolve = (c) => (c === 'ink' || c === '#1f1e1c') ? THEMES[theme].ink : c;
  const state = {
    tool: 'pen',
    color: store.get('color', COLORS[0]),
    width: store.get('width', { pen: 3, marker: 18, eraser: 24 }),
    penOnly: store.get('penOnly', false),
    where: store.get('where', 'active'),
    fallback: store.get('fallback', 'chat'),
  };

  // ---------- canvas ----------
  const stage = document.getElementById('stage'), topBtn = document.getElementById('top');
  const ink = document.getElementById('ink'), live = document.getElementById('live'), tip = document.getElementById('tip');
  const ictx = ink.getContext('2d');
  // desynchronized = low-latency canvas where the browser supports it
  const lctx = live.getContext('2d', { desynchronized: true }), tctx = tip.getContext('2d', { desynchronized: true });
  let dpr = 1;
  let strokes = store.get('strokes', []);
  let redoStack = [];
  let cur = null, activePointer = null;
  let viewY = Math.max(0, store.get('viewY', 0)); // how far down the endless page we've scrolled (CSS px)

  // Bounding boxes let redraw skip strokes that are off screen, so long pages stay fast.
  const boxes = new WeakMap();
  function box(s) {
    let b = boxes.get(s);
    if (!b) {
      let y0 = Infinity, y1 = -Infinity; const r = s.size * 1.5;
      for (const p of s.points) { if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
      b = [y0 - r, y1 + r]; boxes.set(s, b);
    }
    return b;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    for (const c of [ink, live, tip]) {
      c.width = Math.round(innerWidth * dpr); c.height = Math.round(innerHeight * dpr);
    }
    redraw();
  }

  // Pressure → width. Pencil gives real pressure; fingers/mouse report 0 or 0.5.
  function w(stroke, p) {
    if (stroke.tool === 'marker') return stroke.size;
    if (!stroke.pen) return stroke.size;
    return stroke.size * (0.3 + 1.1 * Math.min(1, Math.max(0, p)));
  }

  function paint(ctx, s, scale = 1, ox = 0, oy = 0) {
    const pts = s.points; if (!pts.length) return;
    ctx.save();
    ctx.setTransform(scale, 0, 0, scale, -ox * scale, -oy * scale);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = ctx.fillStyle = s.tool === 'eraser' ? '#000' : resolve(s.color);
    if (s.tool === 'eraser') ctx.globalCompositeOperation = 'destination-out';
    if (pts.length === 1) {
      ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], w(s, pts[0][2]) / 2, 0, Math.PI * 2); ctx.fill();
    } else if (s.tool === 'marker' || !s.pen) {
      // constant width: one smooth path
      ctx.lineWidth = w(s, 0.5);
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
        ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
      }
      const l = pts[pts.length - 1]; ctx.lineTo(l[0], l[1]); ctx.stroke();
    } else {
      // variable width: short curved segments between midpoints
      let px = pts[0][0], py = pts[0][1];
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i], b = pts[i + 1];
        const mx = b ? (a[0] + b[0]) / 2 : a[0], my = b ? (a[1] + b[1]) / 2 : a[1];
        ctx.lineWidth = w(s, a[2]);
        ctx.beginPath(); ctx.moveTo(px, py); ctx.quadraticCurveTo(a[0], a[1], mx, my); ctx.stroke();
        px = mx; py = my;
      }
    }
    ctx.restore();
  }

  // Markers are drawn on a scratch layer and composited at fixed alpha so overlaps within a stroke don't darken.
  const scratch = document.createElement('canvas'), sctx = scratch.getContext('2d');
  function paintAny(ctx, s, scale = 1, ox = 0, oy = 0) {
    if (s.tool !== 'marker') return paint(ctx, s, scale, ox, oy);
    const cw = ctx.canvas.width, ch = ctx.canvas.height;
    if (scratch.width !== cw || scratch.height !== ch) { scratch.width = cw; scratch.height = ch; }
    else { sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, cw, ch); }
    paint(sctx, s, scale, ox, oy);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 0.38; ctx.drawImage(scratch, 0, 0); ctx.restore();
  }

  function redraw() {
    ictx.setTransform(1, 0, 0, 1, 0, 0); ictx.clearRect(0, 0, ink.width, ink.height);
    const top = viewY, bottom = viewY + innerHeight;
    for (const s of strokes) { const b = box(s); if (b[1] >= top && b[0] <= bottom) paintAny(ictx, s, dpr, 0, viewY); }
    drawLive();
    stage.style.backgroundPosition = '0 ' + (-viewY % 28) + 'px';
    topBtn.style.display = viewY > 200 ? 'block' : 'none';
    syncButtons();
  }

  // ---- live stroke: drawn incrementally, straight from the pointer event (no frame wait) ----
  // Settled segments go onto `live` once and are never redrawn; only the short unsettled tip
  // (plus the Pencil's predicted points) is redrawn on `tip` each event. Cost per event stays constant.
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  function prep(ctx, s) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, -viewY * dpr);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = ctx.fillStyle = s.tool === 'eraser' ? '#000' : resolve(s.color);
    ctx.globalCompositeOperation = s.tool === 'eraser' ? 'destination-out' : 'source-over';
  }
  function clearCtx(ctx) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); }
  function drawLive() { clearCtx(lctx); clearCtx(tctx); }

  function advance(predicted = []) {
    const s = cur, pts = s.points, n = pts.length;
    const ctx = s.tool === 'eraser' ? ictx : lctx;
    ctx.save(); prep(ctx, s);
    for (let i = s.seg; i <= n - 2; i++) {
      const a = pts[i], from = i === 1 ? pts[0] : mid(pts[i - 1], a), to = mid(a, pts[i + 1]);
      ctx.lineWidth = w(s, a[2]);
      ctx.beginPath(); ctx.moveTo(from[0], from[1]); ctx.quadraticCurveTo(a[0], a[1], to[0], to[1]); ctx.stroke();
    }
    s.seg = Math.max(s.seg, n - 1);
    ctx.restore();

    clearCtx(tctx);
    if (s.tool === 'eraser' && n > 1) { // eraser has no visible ink; just finish the cut to the pen tip
      ictx.save(); prep(ictx, s); ictx.lineWidth = w(s, 0.5);
      const from = n >= 3 ? mid(pts[n - 2], pts[n - 1]) : pts[0];
      ictx.beginPath(); ictx.moveTo(from[0], from[1]); ictx.lineTo(pts[n - 1][0], pts[n - 1][1]); ictx.stroke(); ictx.restore();
      return;
    }
    tctx.save(); prep(tctx, s);
    const last = pts[n - 1];
    if (n === 1 && !predicted.length) {
      tctx.beginPath(); tctx.arc(last[0], last[1], w(s, last[2]) / 2, 0, Math.PI * 2); tctx.fill();
    } else {
      const from = n >= 3 ? mid(pts[n - 2], last) : pts[0];
      tctx.lineWidth = w(s, last[2]);
      tctx.beginPath(); tctx.moveTo(from[0], from[1]); tctx.lineTo(last[0], last[1]);
      for (const p of predicted) tctx.lineTo(p[0], p[1]);
      tctx.stroke();
    }
    tctx.restore();
  }

  function accepts(e) {
    if (e.pointerType === 'pen' && !state.penOnly && !store.get('sawPen', false)) {
      // First Pencil touch: switch on palm rejection automatically.
      store.set('sawPen', true); setPenOnly(true);
    }
    return !(state.penOnly && e.pointerType === 'touch');
  }
  const r1 = (v) => Math.round(v * 10) / 10, r2 = (v) => Math.round(v * 100) / 100;
  const pt = (e) => [r1(e.clientX), r1(e.clientY + viewY), e.pointerType === 'pen' ? r2(e.pressure || 0.5) : 0.5];

  // ---- scrolling: fingers scroll when "Pencil only" is on; otherwise two fingers scroll ----
  const touches = new Map(); let panning = false, vel = 0, lastT = 0, inertia = 0, redrawQueued = false;
  function setView(y) {
    viewY = Math.max(0, y);
    if (!redrawQueued) { redrawQueued = true; requestAnimationFrame(() => { redrawQueued = false; redraw(); }); }
    clearTimeout(setView.t); setView.t = setTimeout(() => store.set('viewY', viewY), 400);
  }
  const avgY = () => { let t = 0; for (const p of touches.values()) t += p; return t / touches.size; };
  function panStart(e) {
    touches.set(e.pointerId, e.clientY);
    if (!(state.penOnly || touches.size >= 2)) return false;
    if (cur && !cur.pen) { cur = null; activePointer = null; drawLive(); } // 2nd finger: that was a scroll, not a stroke
    try { stage.setPointerCapture(e.pointerId); } catch {}
    cancelAnimationFrame(inertia); panning = true; vel = 0; lastT = e.timeStamp;
    return true;
  }
  stage.addEventListener('pointermove', (e) => {
    if (!touches.has(e.pointerId)) return;
    const before = avgY(); touches.set(e.pointerId, e.clientY);
    if (!panning) return;
    const dy = avgY() - before, dt = Math.max(1, e.timeStamp - lastT);
    vel = 0.8 * (-dy / dt) + 0.2 * vel; lastT = e.timeStamp;
    setView(viewY - dy);
  });
  const touchEnd = (e) => {
    if (!touches.delete(e.pointerId) || touches.size || !panning) return;
    panning = false;
    if (e.timeStamp - lastT > 80) return;
    let v = vel * 16; // px per frame, glide to a stop
    const glide = () => { v *= 0.95; if (Math.abs(v) < 0.3 || viewY === 0 && v < 0) return; setView(viewY + v); inertia = requestAnimationFrame(glide); };
    inertia = requestAnimationFrame(glide);
  };
  for (const t of ['pointerup', 'pointercancel']) stage.addEventListener(t, (e) => { if (e.pointerType === 'touch') touchEnd(e); });
  stage.addEventListener('wheel', (e) => { e.preventDefault(); setView(viewY + e.deltaY); }, { passive: false });
  topBtn.onclick = () => setView(0);

  stage.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') cancelAnimationFrame(inertia);
    if (e.pointerType === 'pen' && !state.penOnly) accepts(e);
    if (e.pointerType === 'touch' && panStart(e)) return;
    if (!accepts(e)) return;
    if (cur) { if (e.pointerType === 'pen') finish(); else return; } // recover from a lost pointerup
    e.preventDefault();
    try { stage.setPointerCapture(e.pointerId); } catch {}
    activePointer = e.pointerId;
    cur = { tool: state.tool, color: state.color, size: state.width[state.tool], pen: e.pointerType === 'pen', points: [pt(e)], seg: 1 };
    live.style.opacity = tip.style.opacity = cur.tool === 'marker' ? 0.38 : 1;
    drawLive(); advance();
  });
  stage.addEventListener('pointermove', (e) => {
    if (!cur || e.pointerId !== activePointer) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ce of (evs.length ? evs : [e])) {
      const p = pt(ce), last = cur.points[cur.points.length - 1];
      if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 0.6) { last[2] = Math.max(last[2], p[2]); continue; }
      cur.points.push(p);
    }
    const pred = e.getPredictedEvents ? e.getPredictedEvents().slice(0, 3).map(pt) : [];
    advance(pred);
  });
  function finish() {
    const s = cur; cur = null; activePointer = null; delete s.seg;
    strokes.push(s); redoStack = [];
    drawLive();
    if (s.tool === 'eraser') redraw(); else { paintAny(ictx, s, dpr, 0, viewY); syncButtons(); }
    save();
  }
  const end = (e) => {
    if (!cur || e.pointerId !== activePointer) return;
    if (e.type === 'pointerup') {
      // pointerup reports pressure 0; keep the last real pressure so taps and line ends aren't hairlines
      const p = pt(e), last = cur.points[cur.points.length - 1];
      if (Math.hypot(p[0] - last[0], p[1] - last[1]) >= 0.6) { p[2] = last[2]; cur.points.push(p); }
    }
    finish();
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('lostpointercapture', end);
  // Stop iOS from scrolling, zooming, or showing the magnifier while drawing.
  for (const t of ['touchstart', 'touchmove', 'gesturestart', 'dblclick']) stage.addEventListener(t, (e) => e.preventDefault(), { passive: false });

  let saveTimer;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem('sk.strokes', JSON.stringify(strokes)); }
      catch { if (!save.warned) { save.warned = true; toast('Drawing too big to auto-save — it will still send fine', true); } }
    }, 300);
  }

  // ---------- toolbar ----------
  const $ = (s) => document.querySelector(s);
  const sw = $('#swatches');
  for (const c of COLORS) {
    const b = document.createElement('button');
    b.className = 'sw'; b.style.background = c === 'ink' ? 'var(--ink)' : c; b.dataset.color = c; b.setAttribute('aria-label', 'Color ' + c);
    b.onclick = () => setColor(c); sw.appendChild(b);
  }
  $('#picker').addEventListener('input', (e) => setColor(e.target.value));
  if (state.color === '#1f1e1c') state.color = 'ink';

  function setColor(c) {
    state.color = c; store.set('color', c);
    if (state.tool === 'eraser') setTool('pen');
    syncButtons();
  }
  function setTool(t) { state.tool = t; syncButtons(); }
  function setPenOnly(v) { state.penOnly = v; store.set('penOnly', v); syncButtons(); }
  document.querySelectorAll('[data-tool]').forEach((b) => b.onclick = () => setTool(b.dataset.tool));
  $('#penonly').onclick = () => setPenOnly(!state.penOnly);
  function applyTheme() {
    document.documentElement.dataset.theme = theme;
    $('#theme').setAttribute('aria-pressed', theme === 'dark');
    redraw();
  }
  $('#theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; store.set('theme', theme); applyTheme(); };

  const range = $('#width');
  range.addEventListener('input', () => {
    state.width[state.tool] = Number(range.value); store.set('width', state.width); syncButtons();
  });

  // Clearing is an undoable step: undo on an empty page restores what was cleared.
  const undoClears = [];
  $('#undo').onclick = () => {
    if (strokes.length) redoStack.push(strokes.pop());
    else if (undoClears.length) { strokes = undoClears.pop(); redoStack.push({ clear: true }); }
    else return;
    redraw(); save();
  };
  $('#redo').onclick = () => {
    const s = redoStack.pop(); if (!s) return;
    if (s.clear) { undoClears.push(strokes); strokes = []; } else strokes.push(s);
    redraw(); save();
  };
  $('#clear').onclick = () => {
    if (!strokes.length) return;
    // Clearing is undoable: push everything as one group.
    undoClears.push(strokes); redoStack = []; strokes = []; redraw(); save();
    toast('Page cleared — Undo brings it back');
    setView(0);
  };
  $('#clear2').onclick = () => $('#clear').onclick();

  document.querySelectorAll('[data-where]').forEach((b) => b.onclick = () => {
    state.where = b.dataset.where; store.set('where', state.where); syncButtons();
  });
  $('#fb').value = state.fallback;
  $('#fb').onchange = (e) => { state.fallback = e.target.value; store.set('fallback', state.fallback); };

  function syncButtons() {
    document.querySelectorAll('[data-tool]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.tool === state.tool));
    document.querySelectorAll('.sw[data-color]').forEach((b) => b.setAttribute('aria-pressed', state.tool !== 'eraser' && b.dataset.color === state.color));
    const custom = !COLORS.includes(state.color);
    $('#custom').setAttribute('aria-pressed', custom && state.tool !== 'eraser');
    if (custom) $('#picker').value = state.color;
    $('#theme').setAttribute('aria-pressed', theme === 'dark');
    $('#penonly').setAttribute('aria-pressed', state.penOnly);
    document.querySelectorAll('[data-where]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.where === state.where));
    $('#fallback').style.display = state.where === 'active' ? '' : 'none';
    range.value = state.width[state.tool];
    const d = Math.max(2, Math.min(28, state.width[state.tool]));
    const dot = $('#dot i');
    dot.style.width = dot.style.height = d + 'px';
    dot.style.background = state.tool === 'eraser' ? 'transparent' : resolve(state.color);
    dot.style.border = state.tool === 'eraser' ? '1.5px dashed var(--muted)' : 'none';
    dot.style.opacity = state.tool === 'marker' ? .5 : 1;
    $('#undo').disabled = !strokes.length && !undoClears.length; $('#redo').disabled = !redoStack.length;
  }

  // ---------- export & send ----------
  function exportPNG() {
    if (!strokes.some((s) => s.tool !== 'eraser')) return null;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const s of strokes) {
      if (s.tool === 'eraser') continue;
      const r = s.size * 1.5;
      for (const [x, y] of s.points) { x0 = Math.min(x0, x - r); y0 = Math.min(y0, y - r); x1 = Math.max(x1, x + r); y1 = Math.max(y1, y + r); }
    }
    const pad = 32;
    x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
    // Keep small doodles from becoming tiny images.
    const minW = 480, minH = 320;
    if (x1 - x0 < minW) { const c = (x0 + x1) / 2; x0 = c - minW / 2; x1 = c + minW / 2; }
    if (y1 - y0 < minH) { const c = (y0 + y1) / 2; y0 = c - minH / 2; y1 = c + minH / 2; }
    const scale = Math.min(2, 4000 / Math.max(x1 - x0, y1 - y0));
    const out = document.createElement('canvas');
    out.width = Math.round((x1 - x0) * scale); out.height = Math.round((y1 - y0) * scale);
    const layer = document.createElement('canvas'); layer.width = out.width; layer.height = out.height;
    const lc = layer.getContext('2d');
    for (const s of strokes) paintAny(lc, s, scale, x0, y0);
    const oc = out.getContext('2d');
    oc.fillStyle = THEMES[theme].paper; oc.fillRect(0, 0, out.width, out.height);
    oc.drawImage(layer, 0, 0);
    return new Promise((r) => out.toBlob(r, 'image/png'));
  }

  const sendBtn = $('#send');
  sendBtn.onclick = async () => {
    const blobP = exportPNG();
    if (!blobP) return toast('Draw something first', true);
    if (!TOKEN) return toast('Not paired — open the link the Mac server printed', true);
    sendBtn.disabled = true;
    try {
      const res = await fetch('/api/send', {
        method: 'POST', body: await blobP,
        headers: { 'Content-Type': 'image/png', 'X-Token': TOKEN, 'X-Target': state.where, 'X-Fallback': state.fallback },
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.error || 'HTTP ' + res.status);
      toast(j.demo ? 'Relay received it — demo mode, nothing pasted' : 'In Claude’s message box (' + j.where + ') — press Send on your Mac');
      checkStatus();
    } catch (e) {
      toast(e.message === 'Load failed' || e.message === 'Failed to fetch' ? 'Can’t reach your Mac — is the relay running?' : e.message, true);
    } finally { sendBtn.disabled = false; }
  };

  // ---------- status & toast ----------
  const statusEl = $('#status');
  async function checkStatus() {
    let cls = 'bad', text = 'Mac not reachable';
    try {
      const r = await fetch('/api/status', { method: 'POST', headers: { 'X-Token': TOKEN } });
      if (r.status === 401) { cls = 'bad'; text = 'Not paired'; }
      else if (!r.ok) { cls = 'bad'; text = (await r.json().catch(() => ({}))).error || 'Mac error'; }
      else if (r.ok) {
        const s = await r.json();
        if (s.demo) { cls = 'ok'; text = 'Relay connected (demo mode)'; }
        else if (s.running && s.windows > 0) { cls = 'ok'; text = 'Claude open on Mac'; }
        else { cls = 'warn'; text = 'Claude not open — will start a new ' + (state.fallback === 'code' ? 'code session' : 'chat'); }
      }
    } catch {}
    statusEl.className = cls; statusEl.querySelector('span').textContent = text;
  }

  const toastEl = $('#toast'); let toastTimer;
  function toast(msg, err = false, action = null) {
    toastEl.textContent = msg; toastEl.className = 'show' + (err ? ' err' : '');
    toastEl.style.pointerEvents = action ? 'auto' : 'none';
    if (action) {
      const b = document.createElement('button');
      b.textContent = action.label; b.style.cssText = 'margin-left:12px;font-weight:600;text-decoration:underline;color:inherit';
      b.onclick = () => { action.fn(); toastEl.className = ''; };
      toastEl.appendChild(b);
    }
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.className = ''; toastEl.style.pointerEvents = 'none'; }, err ? 5000 : 3500);
  }

  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkStatus(); });
  document.documentElement.dataset.theme = theme;
  resize(); checkStatus(); setInterval(checkStatus, 8000);
})();
</script>
</body>
</html>
